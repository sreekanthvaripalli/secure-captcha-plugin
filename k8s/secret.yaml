apiVersion: v1
kind: Secret
metadata:
  name: secure-captcha-secret
  namespace: secure-captcha
  labels:
    app.kubernetes.io/name: secure-captcha
    app.kubernetes.io/component: secret
type: Opaque
data:
  # Base64 encoded values - replace with actual secrets
  # echo -n 'value' | base64
  
  # Database Password
  POSTGRES_PASSWORD: Y2hhbmdlX21lX2luX3Byb2R1Y3Rpb24=  # change_me_in_production
  
  # Redis Password (if required)
  REDIS_PASSWORD: Y2hhbmdlX21lX2luX3Byb2R1Y3Rpb24=  # change_me_in_production
  
  # JWT Secret
  JWT_SECRET: c3VwZXJfc2VjcmV0X2p3dF9rZXlfY2hhbmdlX21l  # super_secret_jwt_key_change_me
  
  # API Keys Encryption Key
  API_KEY_ENCRYPTION_KEY: Y2hhbmdlX21lX2luX3Byb2R1Y3Rpb24=  # change_me_in_production
  
  # Session Secret
  SESSION_SECRET: c3VwZXJfc2VjcmV0X3Nlc3Npb25fa2V5X2NoYW5nZV9tZQ==  # super_secret_session_key_change_me
  
  # Encryption Key for Captcha Data
  CAPTCHA_ENCRYPTION_KEY: Y2hhbmdlX21lX2luX3Byb2R1Y3Rpb24=  # change_me_in_production
  
  # Grafana Admin Password
  GF_SECURITY_ADMIN_PASSWORD: YWRtaW4xMjM=  # admin123