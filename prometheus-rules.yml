groups:
  - name: secure-captcha-alerts
    rules:
      # High Error Rate Alerts
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          service: secure-captcha
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for more than 2 minutes. Current value: {{ $value }}"
          runbook: "docs/runbook/error-rate.md"

      - alert: CriticalErrorRate
        expr: rate(http_requests_total{status=~"5.."}[2m]) > 0.2
        for: 1m
        labels:
          severity: critical
          service: secure-captcha
        annotations:
          summary: "CRITICAL: High error rate"
          description: "Error rate is above 20% for more than 1 minute. Current value: {{ $value }}"
          runbook: "docs/runbook/critical-error.md"

      # Latency Alerts
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 3m
        labels:
          severity: warning
          service: secure-captcha
        annotations:
          summary: "High P95 latency"
          description: "95th percentile latency is above 500ms for more than 3 minutes. Current value: {{ $value }}s"
          runbook: "docs/runbook/latency.md"

      - alert: CriticalLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[2m])) > 2.0
        for: 1m
        labels:
          severity: critical
          service: secure-captcha
        annotations:
          summary: "CRITICAL: High latency"
          description: "95th percentile latency is above 2s for more than 1 minute. Current value: {{ $value }}s"
          runbook: "docs/runbook/critical-latency.md"

      # Availability Alerts
      - alert: ServiceDown
        expr: up{job="secure-captcha"} == 0
        for: 30s
        labels:
          severity: critical
          service: secure-captcha
        annotations:
          summary: "Secure CAPTCHA service is DOWN"
          description: "Service has been down for more than 30 seconds"
          runbook: "docs/runbook/service-down.md"

      - alert: LowAvailability
        expr: avg_over_time(up{job="secure-captcha"}[5m]) < 0.99
        for: 5m
        labels:
          severity: warning
          service: secure-captcha
        annotations:
          summary: "Low service availability"
          description: "Service availability is below 99% over the last 5 minutes. Current value: {{ $value }}%"
          runbook: "docs/runbook/availability.md"

      # Resource Usage Alerts
      - alert: HighMemoryUsage
        expr: node_memory_Active_bytes / node_memory_MemTotal_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          service: secure-captcha
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 85% for more than 5 minutes. Current value: {{ $value }}%"
          runbook: "docs/runbook/memory.md"

      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: secure-captcha
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% for more than 5 minutes. Current value: {{ $value }}%"
          runbook: "docs/runbook/cpu.md"

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 5m
        labels:
          severity: warning
          service: secure-captcha
        annotations:
          summary: "Low disk space"
          description: "Disk space usage is above 85% for more than 5 minutes. Current value: {{ $value }}%"
          runbook: "docs/runbook/disk.md"

      # Security Alerts
      - alert: HighRateLimitHits
        expr: rate(rate_limit_hits_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
          service: secure-captcha
          category: security
        annotations:
          summary: "High rate limit hits"
          description: "Rate limit hits are above 100 per minute for more than 2 minutes. Current value: {{ $value }}"
          runbook: "docs/runbook/rate-limits.md"

      - alert: SuspiciousActivity
        expr: rate(security_events_total{type="suspicious"}[10m]) > 50
        for: 5m
        labels:
          severity: warning
          service: secure-captcha
          category: security
        annotations:
          summary: "High suspicious activity"
          description: "Suspicious security events are above 50 per minute for more than 5 minutes. Current value: {{ $value }}"
          runbook: "docs/runbook/suspicious-activity.md"

      - alert: BotDetectionRate
        expr: rate(captcha_validations_total{result="bot"}[5m]) / rate(captcha_validations_total[5m]) > 0.3
        for: 5m
        labels:
          severity: warning
          service: secure-captcha
          category: security
        annotations:
          summary: "High bot detection rate"
          description: "Bot detection rate is above 30% for more than 5 minutes. Current value: {{ $value }}%"
          runbook: "docs/runbook/bot-activity.md"

      # Database Alerts
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: secure-captcha
          component: database
        annotations:
          summary: "PostgreSQL database is DOWN"
          description: "PostgreSQL database connection failed for more than 1 minute"
          runbook: "docs/runbook/database-down.md"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          service: secure-captcha
          component: cache
        annotations:
          summary: "Redis cache is DOWN"
          description: "Redis cache connection failed for more than 1 minute"
          runbook: "docs/runbook/redis-down.md"

      # Deployment Alerts
      - alert: DeploymentFailed
        expr: deployment_status{status="failed"} > 0
        for: 1m
        labels:
          severity: critical
          service: secure-captcha
          category: deployment
        annotations:
          summary: "Deployment FAILED"
          description: "Recent deployment has failed. Check CI/CD pipeline for details."
          runbook: "docs/runbook/deployment-failed.md"

      # Business Alerts
      - alert: LowSuccessRate
        expr: rate(captcha_validations_total{result="success"}[10m]) / rate(captcha_validations_total[10m]) < 0.7
        for: 10m
        labels:
          severity: warning
          service: secure-captcha
        annotations:
          summary: "Low CAPTCHA success rate"
          description: "CAPTCHA validation success rate is below 70% for more than 10 minutes. Current value: {{ $value }}%"
          runbook: "docs/runbook/low-success-rate.md"