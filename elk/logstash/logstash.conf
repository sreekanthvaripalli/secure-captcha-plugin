input {
  # Elasticsearch input for Winston logs
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "secure-captcha-*"
    query => '{ "query": { "match_all": {} } }'
    schedule => "* * * * *"
  }
  
  # File input for application logs
  file {
    path => "/usr/share/logstash/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/sincedb"
    codec => json
    type => "application"
  }
  
  # Beats input for system logs
  beats {
    port => 5044
    type => "system"
  }
  
  # TCP input for direct log shipping
  tcp {
    port => 5000
    type => "application"
    codec => json_lines
  }
  
  # HTTP input for webhook logs
  http {
    port => 8080
    type => "webhook"
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [type] == "application" {
    json {
      source => "message"
      target => "parsed"
    }
    
    # Extract timestamp
    date {
      match => [ "[parsed][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }
    
    # Add log level
    if [parsed][level] {
      mutate {
        add_field => { "log_level" => "%{[parsed][level]}" }
      }
    }
    
    # Add service name
    if [parsed][service] {
      mutate {
        add_field => { "service_name" => "%{[parsed][service]}" }
      }
    }
    
    # Add log type
    if [parsed][type] {
      mutate {
        add_field => { "log_type" => "%{[parsed][type]}" }
      }
    }
    
    # Add request ID if present
    if [parsed][requestId] {
      mutate {
        add_field => { "request_id" => "%{[parsed][requestId]}" }
      }
    }
    
    # Add session ID if present
    if [parsed][sessionId] {
      mutate {
        add_field => { "session_id" => "%{[parsed][sessionId]}" }
      }
    }
    
    # Add IP address if present
    if [parsed][ip] {
      mutate {
        add_field => { "client_ip" => "%{[parsed][ip]}" }
      }
    }
    
    # Add user agent if present
    if [parsed][userAgent] {
      mutate {
        add_field => { "user_agent" => "%{[parsed][userAgent]}" }
      }
    }
    
    # Add endpoint if present
    if [parsed][endpoint] {
      mutate {
        add_field => { "endpoint" => "%{[parsed][endpoint]}" }
      }
    }
    
    # Add HTTP method if present
    if [parsed][method] {
      mutate {
        add_field => { "http_method" => "%{[parsed][method]}" }
      }
    }
    
    # Add status code if present
    if [parsed][statusCode] {
      mutate {
        add_field => { "status_code" => "%{[parsed][statusCode]}" }
      }
    }
    
    # Add response time if present
    if [parsed][responseTime] {
      mutate {
        add_field => { "response_time_ms" => "%{[parsed][responseTime]}" }
      }
    }
    
    # Add captcha type if present
    if [parsed][captchaType] {
      mutate {
        add_field => { "captcha_type" => "%{[parsed][captchaType]}" }
      }
    }
    
    # Add difficulty if present
    if [parsed][difficulty] {
      mutate {
        add_field => { "difficulty" => "%{[parsed][difficulty]}" }
      }
    }
    
    # Add error details if present
    if [parsed][error] {
      mutate {
        add_field => { 
          "error_name" => "%{[parsed][error][name]}"
          "error_message" => "%{[parsed][error][message]}"
        }
      }
      
      if [parsed][error][stack] {
        mutate {
          add_field => { "error_stack" => "%{[parsed][error][stack]}" }
        }
      }
    }
    
    # Add security event details if present
    if [parsed][eventType] {
      mutate {
        add_field => { "event_type" => "%{[parsed][eventType]}" }
      }
    }
    
    if [parsed][severity] {
      mutate {
        add_field => { "severity" => "%{[parsed][severity]}" }
      }
    }
    
    # Add performance metric if present
    if [parsed][metric] {
      mutate {
        add_field => { 
          "metric_name" => "%{[parsed][metric]}"
          "metric_value" => "%{[parsed][value]}"
          "metric_unit" => "%{[parsed][unit]}"
        }
      }
    }
    
    # Add audit action if present
    if [parsed][action] {
      mutate {
        add_field => { "audit_action" => "%{[parsed][action]}" }
      }
    }
    
    # Remove original message field
    mutate {
      remove_field => [ "message" ]
    }
  }
  
  # Parse system logs
  if [type] == "system" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }
    }
    
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }
  }
  
  # GeoIP lookup for client IPs
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
  
  # User agent parsing
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }
  
  # Add hostname
  mutate {
    add_field => { "hostname" => "%{host}" }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "@version" ]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "secure-captcha-%{+YYYY.MM.dd}"
    template_name => "secure-captcha"
    template => "/usr/share/logstash/templates/secure-captcha-template.json"
    template_overwrite => true
  }
  
  # Output to console for debugging
  stdout {
    codec => rubydebug
  }
  
  # Output to file for backup
  file {
    path => "/usr/share/logstash/output/secure-captcha-%{+YYYY-MM-dd}.log"
    codec => json_lines
  }
}