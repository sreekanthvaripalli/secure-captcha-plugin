<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure CAPTCHA Plugin - API Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
    }
    .swagger-ui .topbar {
      display: none;
    }
    .swagger-ui .info .title small {
      background-color: #2d7af1;
    }
    .swagger-ui .scheme-container {
      background: #ffffff;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.15);
    }
    .api-banner {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .api-banner h1 {
      margin: 0;
      font-size: 24px;
    }
    .api-banner p {
      margin: 8px 0 0;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="api-banner">
    <h1>Secure CAPTCHA Plugin API</h1>
    <p>Enterprise-grade CAPTCHA protection with multi-layer security</p>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: '../openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: 'StandaloneLayout',
        validatorUrl: null,
        docExpansion: 'list',
        defaultModelsExpandDepth: 2,
        defaultModelExpandDepth: 2,
        displayRequestDuration: true,
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        tryItOutEnabled: true,
        requestSnippetsEnabled: true,
        requestSnippets: {
          generators: {
            curl_bash: { title: 'cURL (bash)' },
            curl_powershell: { title: 'cURL (PowerShell)' },
            curl_cmd: { title: 'cURL (CMD)' },
            node: { title: 'Node.js' },
            python: { title: 'Python' },
            java: { title: 'Java' }
          }
        }
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
