openapi: 3.0.3
info:
  title: Secure CAPTCHA Plugin API
  description: |
    Enterprise-grade, non-crackable CAPTCHA plugin API with multi-layer security,
    behavioral analysis, and comprehensive threat detection.
    
    ## Features
    - Multiple CAPTCHA types (text, math, logic, image)
    - Configurable difficulty levels (easy, medium, hard)
    - Session-based validation with encryption
    - Behavioral analysis integration
    - Device fingerprinting
    - Rate limiting and threat protection
    
    ## Authentication
    Most endpoints require authentication via API Key or JWT token.
    Include your credentials in the `Authorization` header:
    - API Key: `Authorization: Bearer YOUR_API_KEY`
    - JWT: `Authorization: Bearer YOUR_JWT_TOKEN`
    
    ## Rate Limiting
    - Default: 100 requests per minute per IP
    - Rate limit headers included in all responses:
      - `X-RateLimit-Limit`: Maximum requests allowed
      - `X-RateLimit-Remaining`: Requests remaining
      - `X-RateLimit-Reset`: Time when rate limit resets
  version: 1.0.0
  contact:
    name: Secure CAPTCHA API Support
    email: support@secure-captcha.com
    url: https://github.com/sreekanthvaripalli/secure-captcha-plugin
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.secure-captcha.com/v1
    description: Production server
  - url: http://localhost:3000/api/v1
    description: Local development server

tags:
  - name: Health
    description: Health check and status endpoints
  - name: CAPTCHA
    description: CAPTCHA generation and validation
  - name: Configuration
    description: API configuration and metadata
  - name: Metrics
    description: Prometheus metrics and monitoring

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health Check
      description: |
        Returns the health status of the API server including version, uptime,
        and memory usage. This endpoint does not require authentication.
      operationId: getHealth
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
                timestamp: '2026-03-31T12:00:00.000Z'
                version: 1.0.0
                uptime: 86400
                memory:
                  rss: 52428800
                  heapTotal: 20971520
                  heapUsed: 15728640
                  external: 1048576
        '503':
          description: Server is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /metrics:
    get:
      tags:
        - Metrics
      summary: Prometheus Metrics
      description: |
        Returns application metrics in Prometheus format.
        Includes request rates, latency, error rates, and custom CAPTCHA metrics.
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP http_requests_total Total number of HTTP requests
                # TYPE http_requests_total counter
                http_requests_total{method="GET",path="/api/v1/health",status="200"} 1500
                # HELP http_request_duration_seconds HTTP request duration in seconds
                # TYPE http_request_duration_seconds histogram
                http_request_duration_seconds_bucket{le="0.1"} 1200
                http_request_duration_seconds_bucket{le="0.5"} 1450
                http_request_duration_seconds_bucket{le="1"} 1490
                http_request_duration_seconds_bucket{le="+Inf"} 1500
        '500':
          description: Error generating metrics

  /captcha/generate:
    post:
      tags:
        - CAPTCHA
      summary: Generate CAPTCHA
      description: |
        Generates a new CAPTCHA challenge of the specified type and difficulty.
        Returns a session ID and the challenge data (image, text, etc.).
        
        The session ID must be used when validating the user's response.
      operationId: generateCaptcha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCaptchaRequest'
            examples:
              text_easy:
                summary: Text CAPTCHA - Easy
                value:
                  type: text
                  difficulty: easy
              math_medium:
                summary: Math CAPTCHA - Medium
                value:
                  type: math
                  difficulty: medium
              logic_hard:
                summary: Logic CAPTCHA - Hard
                value:
                  type: logic
                  difficulty: hard
              image_medium:
                summary: Image CAPTCHA - Medium
                value:
                  type: image
                  difficulty: medium
                  options:
                    categories:
                      - animals
                      - vehicles
      responses:
        '200':
          description: CAPTCHA generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateCaptchaResponse'
              examples:
                text:
                  summary: Text CAPTCHA Response
                  value:
                    success: true
                    data:
                      sessionId: abc123-def456-ghi789
                      challenge: data:image/png;base64,iVBORw0KGgoAAAANSUhEUg...
                      type: text
                      difficulty: easy
                      expiresIn: 300
                      metadata:
                        ip: 192.168.1.1
                        userAgent: Mozilla/5.0...
                math:
                  summary: Math CAPTCHA Response
                  value:
                    success: true
                    data:
                      sessionId: abc123-def456-ghi789
                      challenge: "What is 5 + 3?"
                      type: math
                      difficulty: medium
                      expiresIn: 300
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_type:
                  summary: Missing CAPTCHA type
                  value:
                    success: false
                    error:
                      code: INVALID_REQUEST
                      message: Captcha type is required
                invalid_type:
                  summary: Invalid CAPTCHA type
                  value:
                    success: false
                    error:
                      code: INVALID_CAPTCHA_TYPE
                      message: 'Unsupported captcha type: invalid'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: RATE_LIMIT_EXCEEDED
                  message: Too many requests, please try again later
        '500':
          description: Internal server error

  /captcha/validate:
    post:
      tags:
        - CAPTCHA
      summary: Validate CAPTCHA Response
      description: |
        Validates a user's CAPTCHA response against the generated challenge.
        Returns whether the answer is correct and a security score.
      operationId: validateCaptcha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCaptchaRequest'
            examples:
              valid_response:
                summary: Valid CAPTCHA Response
                value:
                  sessionId: abc123-def456-ghi789
                  response: correct_answer
                  type: text
              invalid_response:
                summary: Invalid CAPTCHA Response
                value:
                  sessionId: abc123-def456-ghi789
                  response: wrong_answer
                  type: text
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCaptchaResponse'
              examples:
                valid:
                  summary: Valid Response
                  value:
                    success: true
                    data:
                      valid: true
                      securityScore: 95
                      message: CAPTCHA validated successfully
                invalid:
                  summary: Invalid Response
                  value:
                    success: true
                    data:
                      valid: false
                      securityScore: 10
                      message: Incorrect answer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_session:
                  summary: Missing Session ID
                  value:
                    success: false
                    error:
                      code: INVALID_REQUEST
                      message: Session ID is required
                missing_response:
                  summary: Missing Response
                  value:
                    success: false
                    error:
                      code: INVALID_REQUEST
                      message: Response is required
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: SESSION_NOT_FOUND
                  message: CAPTCHA session not found
        '410':
          description: Session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: SESSION_EXPIRED
                  message: CAPTCHA session has expired
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: MAX_ATTEMPTS_EXCEEDED
                  message: Maximum validation attempts exceeded

  /captcha/types:
    get:
      tags:
        - Configuration
      summary: Get Available CAPTCHA Types
      description: |
        Returns a list of all available CAPTCHA types and their supported
        difficulty levels.
      operationId: getCaptchaTypes
      responses:
        '200':
          description: List of CAPTCHA types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaTypesResponse'
              example:
                success: true
                data:
                  types:
                    - type: text
                      name: Text Captcha
                      difficulties:
                        - easy
                        - medium
                        - hard
                    - type: math
                      name: Math Captcha
                      difficulties:
                        - easy
                        - medium
                        - hard
                    - type: logic
                      name: Logic Captcha
                      difficulties:
                        - easy
                        - medium
                        - hard
                    - type: image
                      name: Image Captcha
                      difficulties:
                        - easy
                        - medium
                        - hard
        '500':
          description: Internal server error

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
        - uptime
        - memory
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
          description: Current health status
        timestamp:
          type: string
          format: date-time
          description: Server timestamp
        version:
          type: string
          description: API version
        uptime:
          type: number
          description: Server uptime in seconds
        memory:
          type: object
          description: Node.js memory usage
          properties:
            rss:
              type: integer
              description: Resident Set Size
            heapTotal:
              type: integer
              description: Total heap size
            heapUsed:
              type: integer
              description: Used heap size
            external:
              type: integer
              description: External memory

    GenerateCaptchaRequest:
      type: object
      required:
        - type
        - difficulty
      properties:
        type:
          type: string
          enum:
            - text
            - math
            - logic
            - image
          description: Type of CAPTCHA to generate
        difficulty:
          type: string
          enum:
            - easy
            - medium
            - hard
          description: Difficulty level
        options:
          type: object
          description: Additional options for CAPTCHA generation
          properties:
            length:
              type: integer
              description: Length of text CAPTCHA (for text type)
            categories:
              type: array
              items:
                type: string
              description: Categories for image CAPTCHA
            operations:
              type: array
              items:
                type: string
              description: Math operations (for math type)
            language:
              type: string
              description: Language for text-based CAPTCHAs

    GenerateCaptchaResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        data:
          $ref: '#/components/schemas/CaptchaData'

    CaptchaData:
      type: object
      required:
        - sessionId
        - challenge
        - type
        - difficulty
        - expiresIn
      properties:
        sessionId:
          type: string
          format: uuid
          description: Unique session identifier for validation
        challenge:
          type: string
          description: |
            The CAPTCHA challenge. For text/image types, this is a base64-encoded
            image (data URI format). For math/logic types, this is the question text.
        type:
          type: string
          enum:
            - text
            - math
            - logic
            - image
          description: Type of CAPTCHA
        difficulty:
          type: string
          enum:
            - easy
            - medium
            - hard
          description: Difficulty level
        expiresIn:
          type: integer
          description: Time until expiration in seconds
        metadata:
          type: object
          description: Request metadata
          properties:
            ip:
              type: string
              description: Client IP address
            userAgent:
              type: string
              description: Client user agent

    ValidateCaptchaRequest:
      type: object
      required:
        - sessionId
        - response
        - type
      properties:
        sessionId:
          type: string
          format: uuid
          description: Session ID from CAPTCHA generation
        response:
          type: string
          description: User's answer to the CAPTCHA challenge
        type:
          type: string
          enum:
            - text
            - math
            - logic
            - image
          description: Type of CAPTCHA being validated

    ValidateCaptchaResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        data:
          $ref: '#/components/schemas/ValidationResult'

    ValidationResult:
      type: object
      required:
        - valid
        - securityScore
        - message
      properties:
        valid:
          type: boolean
          description: Whether the answer is correct
        securityScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Security score based on behavioral analysis
        message:
          type: string
          description: Human-readable result message

    CaptchaTypesResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Whether the request was successful
        data:
          type: object
          properties:
            types:
              type: array
              items:
                $ref: '#/components/schemas/CaptchaTypeInfo'

    CaptchaTypeInfo:
      type: object
      properties:
        type:
          type: string
          description: CAPTCHA type identifier
        name:
          type: string
          description: Human-readable name
        difficulties:
          type: array
          items:
            type: string
            enum:
              - easy
              - medium
              - hard
          description: Supported difficulty levels

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
          description: Always false for error responses
        error:
          $ref: '#/components/schemas/ErrorDetails'

    ErrorDetails:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        requestId:
          type: string
          format: uuid
          description: Request ID for tracing
        timestamp:
          type: string
          format: date-time
          description: Error timestamp

  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
      description: API Key authentication
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication

security:
  - ApiKeyAuth: []
  - JWTAuth: []