global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Secure CAPTCHA application metrics
  - job_name: 'secure-captcha'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'secure-captcha'
          environment: 'production'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Node exporter for system metrics (optional)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']