global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      group_wait: 10s
      repeat_interval: 1h
      
    - match:
        severity: warning
      receiver: 'slack-warnings'
      repeat_interval: 6h
      
    - match:
        category: security
      receiver: 'security-team'
      repeat_interval: 2h
      
    - match:
        category: deployment
      receiver: 'engineering-team'
      repeat_interval: 30m

receivers:
  - name: 'default'
    email_configs:
      - to: 'alerts@example.com'
        send_resolved: true

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        send_resolved: true
        description: '{{ .CommonAnnotations.summary }}'
        client: 'Secure CAPTCHA Monitoring'
        client_url: 'https://grafana.example.com/d/alertmanager'

  - name: 'slack-warnings'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-warning'
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}\nRunbook: {{ .CommonAnnotations.runbook }}'
        color: 'warning'

  - name: 'security-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#security-alerts'
        send_resolved: true
        title: '🔒 SECURITY ALERT: {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}\nRunbook: {{ .CommonAnnotations.runbook }}'
        color: 'danger'

  - name: 'engineering-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#engineering-alerts'
        send_resolved: true
        title: '🚀 DEPLOYMENT ALERT: {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}\nRunbook: {{ .CommonAnnotations.runbook }}'
        color: '#4287f5'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']