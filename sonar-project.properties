# SonarQube Configuration for secure-captcha-plugin
# =====================================================
# This file configures SonarQube static code analysis.
# 
# Prerequisites:
#   - SonarQube Server (Community Edition or higher)
#   - SonarQube Scanner CLI installed
#
# Usage:
#   sonar-scanner
#   # Or with explicit parameters:
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.login=your_token
#
# Docker usage:
#   docker run --rm -e SONAR_HOST_URL=http://host.docker.internal:9000 -e SONAR_LOGIN=your_token -v "$(pwd):/usr/src" sonarsource/sonar-scanner-cli

# Project identification
sonar.projectKey=secure-captcha-plugin
sonar.projectName=Secure CAPTCHA Plugin
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Test configuration
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

# Coverage configuration
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/tests/**,**/__mocks__/**,**/types/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate thresholds
sonar.qualitygate.wait=true

# SCM configuration
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# Issue exclusions
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore console.log in production code (informational only)
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S106
sonar.issue.ignore.multicriteria.e1.resourceKey=src/**/*.ts

# Ignore any type warnings in test files
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1854
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*.ts

# Ignore unused local variables in test files
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1481
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/**/*.ts

# Security hotspots to review
# These rules identify potential security issues that need manual review:
# - typescript:S2819: Regular expressions should not be vulnerable to Denial of Service attacks
# - typescript:S5146: Make sure that this dynamic redirect is safe
# - typescript:S5147: Make sure this encryption algorithm is safe
# - typescript:S5148: Make sure this hash algorithm is safe
# - typescript:S5542: Make sure not to use AES without proper mode of operation
# - typescript:S5547: Make sure this is not a vulnerable TLS version